services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (FastAPI REST API)
  # ----------------------------------------------------------------------------
  - type: web
    name: eco-echo-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r server/requirements.txt
    startCommand: python -m uvicorn server.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: USE_AWS_BEDROCK
        value: "false"
      - key: USE_AWS_S3
        value: "false"

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React 19 / Vite SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: eco-echo-frontend
    runtime: static
    plan: free
    branch: main
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_API_URL
        fromService:
          type: web
          name: eco-echo-backend
          property: host
